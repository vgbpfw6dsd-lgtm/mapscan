<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>プライベート位置確認（APIキー不要）</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; }
    
    #map { 
      height: 62vh; 
      width: 100%; 
      z-index: 1;
    }
    
    .panel {
      padding: 14px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      position: relative;
      z-index: 10;
    }
    
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    
    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      min-width: 140px;
    }
    
    button {
      padding: 12px 16px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      white-space: nowrap;
    }
    
    button:active { opacity: 0.85; }
    button.secondary { background: #64748b; }
    button.danger { background: #dc2626; }
    
    #distance {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
      margin: 6px 0 2px;
    }
    
    #status { 
      font-size: 13px; 
      color: #666; 
      margin-top: 2px;
    }
    
    .note {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      line-height: 1.45;
    }

    /* マーカーの見た目調整 */
    .leaflet-marker-icon {
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="row">
      <input type="text" id="latInput" placeholder="相手の緯度（例: 35.1709）" inputmode="decimal">
      <input type="text" id="lngInput" placeholder="相手の経度（例: 136.8815）" inputmode="decimal">
    </div>
    <div class="row">
      <button id="setBtn">相手の位置をセット</button>
      <button id="clearBtn" class="secondary">クリア</button>
      <button id="centerMyBtn" class="secondary">自分に戻る</button>
    </div>
    <div id="distance">距離：―</div>
    <div id="status">自分の位置を取得しています...</div>
    <div class="note">
      ※ APIキー不要・位置情報は外部に送信されません<br>
      ※ 相手の位置は自分で入力した座標のみ使用します
    </div>
  </div>
  
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 地図初期化
    const map = L.map('map').setView([35.2073, 136.9494], 15);

    // OpenStreetMapタイル（無料・APIキー不要）
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // 自分のマーカー（青）
    const myIcon = L.divIcon({
      className: '',
      html: `<div style="
        width: 22px; height: 22px;
        background: #2563eb;
        border: 3px solid white;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      "></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    // 相手のマーカー（赤）
    const targetIcon = L.divIcon({
      className: '',
      html: `<div style="
        width: 22px; height: 22px;
        background: #dc2626;
        border: 3px solid white;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      "></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    let myMarker = null;
    let targetMarker = null;
    let myPos = null;
    let targetPos = null;
    let initialCentered = false;

    // 距離計算（Haversine公式）
    function calcDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000; // 地球半径（メートル）
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function updateDistance() {
      if (myPos && targetPos) {
        const dist = calcDistance(myPos.lat, myPos.lng, targetPos.lat, targetPos.lng);
        document.getElementById('distance').textContent =
          dist < 1000
            ? `距離：約 ${Math.round(dist)} m`
            : `距離：約 ${(dist / 1000).toFixed(2)} km`;

        // 両方のマーカーが見えるように調整
        const group = L.featureGroup([myMarker, targetMarker]);
        map.fitBounds(group.getBounds().pad(0.2));
      } else {
        document.getElementById('distance').textContent = '距離：―';
      }
    }

    // 自分の位置を監視
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        (pos) => {
          myPos = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };

          if (myMarker) {
            myMarker.setLatLng([myPos.lat, myPos.lng]);
          } else {
            myMarker = L.marker([myPos.lat, myPos.lng], { icon: myIcon })
              .addTo(map)
              .bindPopup('自分');
          }

          if (!initialCentered) {
            map.setView([myPos.lat, myPos.lng], 16);
            initialCentered = true;
          }

          updateDistance();
          document.getElementById('status').textContent =
            `自分の位置更新中（精度 約${Math.round(pos.coords.accuracy)}m）`;
        },
        (err) => {
          document.getElementById('status').textContent = '位置情報エラー: ' + err.message;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 4000,
          timeout: 12000
        }
      );
    } else {
      document.getElementById('status').textContent = 'このブラウザは位置情報に対応していません';
    }

    // 相手の位置をセット
    document.getElementById('setBtn').onclick = () => {
      const lat = parseFloat(document.getElementById('latInput').value);
      const lng = parseFloat(document.getElementById('lngInput').value);

      if (isNaN(lat) || isNaN(lng)) {
        alert('緯度と経度を正しく入力してください');
        return;
      }
      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        alert('緯度・経度の範囲が正しくありません');
        return;
      }

      targetPos = { lat, lng };

      if (targetMarker) {
        targetMarker.setLatLng([lat, lng]);
      } else {
        targetMarker = L.marker([lat, lng], { icon: targetIcon })
          .addTo(map)
          .bindPopup('相手');
      }

      updateDistance();
      document.getElementById('status').textContent = '相手の位置をセットしました';
    };

    // クリア
    document.getElementById('clearBtn').onclick = () => {
      if (targetMarker) {
        map.removeLayer(targetMarker);
        targetMarker = null;
      }
      targetPos = null;
      document.getElementById('latInput').value = '';
      document.getElementById('lngInput').value = '';
      document.getElementById('distance').textContent = '距離：―';
      document.getElementById('status').textContent = '相手の位置をクリアしました';
    };

    // 自分の位置に戻る
    document.getElementById('centerMyBtn').onclick = () => {
      if (myPos) {
        map.setView([myPos.lat, myPos.lng], 16);
      }
    };
  </script>
</body>
</html>
