<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ピンで位置指定マップ</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; }
    
    #map { 
      height: 50vh; 
      width: 100%; 
      z-index: 1;
    }
    
    .panel {
      padding: 10px 12px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      position: relative;
      z-index: 10;
      max-height: 48vh;
      overflow-y: auto;
    }
    
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    
    input, select {
      flex: 1;
      padding: 9px 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      min-width: 90px;
      background: #f8fafc;
    }
    
    button {
      padding: 9px 12px;
      font-size: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      white-space: nowrap;
    }
    
    button:active { opacity: 0.85; }
    button.secondary { background: #64748b; }
    button.green { background: #059669; }
    button.orange { background: #ea580c; }
    button.purple { background: #7c3aed; }
    button.active { background: #1d4ed8; box-shadow: 0 0 0 2px #93c5fd; }
    
    #distance {
      font-size: 18px;
      font-weight: bold;
      color: #2563eb;
      margin: 4px 0;
      text-align: center;
    }
    
    #status { 
      font-size: 13px; 
      color: #666; 
      margin-top: 2px;
      text-align: center;
    }
    
    .note {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      line-height: 1.35;
      text-align: center;
    }

    .tip {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 13px;
      color: #1e40af;
      margin-bottom: 6px;
      text-align: center;
    }

    #settingsPanel {
      display: none;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px;
      margin-top: 4px;
    }
    #settingsPanel.show { display: block; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="tip" id="tip">
      地図をタップ → 相手（赤）の位置をセット
    </div>

    <div class="row">
      <input type="text" id="latInput" placeholder="相手の緯度" inputmode="decimal" readonly>
      <input type="text" id="lngInput" placeholder="相手の経度" inputmode="decimal" readonly>
    </div>
    <div class="row">
      <button id="getLocationBtn" class="green">現在地</button>
      <button id="clearBtn" class="secondary">クリア</button>
      <button id="centerMyBtn" class="secondary">自分に戻る</button>
    </div>
    <div class="row">
      <button id="setDestModeBtn" class="orange">目的地セット</button>
      <button id="drawRouteBtn" class="purple">ルートをなぞる</button>
      <button id="clearRouteBtn" class="secondary">ルート消す</button>
    </div>
    <div class="row">
      <button id="startMoveBtn">移動開始</button>
      <button id="settingsBtn" class="secondary">速度設定</button>
    </div>

    <div id="settingsPanel">
      <div class="row">
        <label style="flex:0 0 auto; align-self:center; font-size:14px;">速度:</label>
        <input type="number" id="speedInput" value="1.4" step="0.1" min="0.1" max="50" style="flex:1;">
        <select id="speedUnit" style="flex:0 0 80px;">
          <option value="mps">m/s</option>
          <option value="kmh">km/h</option>
        </select>
      </div>
      <div style="font-size:11px; color:#666; text-align:center; margin-top:2px;">
        1.4m/s徒歩 ／ 5m/s自転車 ／ 13m/s車
      </div>
    </div>

    <div id="distance">距離：―</div>
    <div id="status">地図をタップして相手の位置をセット</div>
    <div class="note">
      青＝自分　赤＝相手　緑＝目的地　紫線＝ルート<br>
      「ルートをなぞる」でタップして道を描く → 移動開始でそのルートを歩く
    </div>
  </div>
  
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const map = L.map('map').setView([35.2078, 136.9502], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const myIcon = L.divIcon({
      className: '',
      html: `<div style="width:22px;height:22px;background:#2563eb;border:3px solid white;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
      iconSize: [22, 22], iconAnchor: [11, 11]
    });

    const targetIcon = L.divIcon({
      className: '',
      html: `<div style="width:22px;height:22px;background:#dc2626;border:3px solid white;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
      iconSize: [22, 22], iconAnchor: [11, 11]
    });

    const destIcon = L.divIcon({
      className: '',
      html: `<div style="width:22px;height:22px;background:#16a34a;border:3px solid white;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
      iconSize: [22, 22], iconAnchor: [11, 11]
    });

    let myMarker = null, targetMarker = null, destMarker = null;
    let myPos = null, targetPos = null, destPos = null;
    let watchId = null;

    let setDestMode = false;
    let drawRouteMode = false;
    let isMoving = false;
    let moveInterval = null;
    let lastMoveTime = 0;

    // ルート関連
    let routePoints = []; // [{lat, lng}, ...]
    let routePolyline = null;
    let pathSegments = []; // {startDist, length, from, to}
    let totalPathLength = 0;
    let currentPathDist = 0;

    function calcDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateDistance() {
      if (myPos && targetPos) {
        const dist = calcDistance(myPos.lat, myPos.lng, targetPos.lat, targetPos.lng);
        document.getElementById('distance').textContent =
          dist < 1000 ? `距離：約 ${Math.round(dist)} m` : `距離：約 ${(dist / 1000).toFixed(2)} km`;
      } else {
        document.getElementById('distance').textContent = '距離：―';
      }
    }

    function updateTip() {
      const tip = document.getElementById('tip');
      if (drawRouteMode) {
        tip.textContent = '地図をタップしてルートをなぞってください（複数点OK）';
        tip.style.background = '#f3e8ff';
        tip.style.borderColor = '#d8b4fe';
        tip.style.color = '#6b21a8';
      } else if (setDestMode) {
        tip.textContent = '地図をタップ → 目的地（緑）をセット';
        tip.style.background = '#fef3c7';
        tip.style.borderColor = '#fde68a';
        tip.style.color = '#92400e';
      } else {
        tip.textContent = '地図をタップ → 相手（赤）の位置をセット';
        tip.style.background = '#eff6ff';
        tip.style.borderColor = '#bfdbfe';
        tip.style.color = '#1e40af';
      }
    }

    function drawRouteLine() {
      if (routePolyline) map.removeLayer(routePolyline);
      if (routePoints.length >= 2) {
        const latlngs = routePoints.map(p => [p.lat, p.lng]);
        routePolyline = L.polyline(latlngs, {
          color: '#7c3aed',
          weight: 5,
          opacity: 0.85,
          lineJoin: 'round'
        }).addTo(map);
      }
    }

    function buildPathSegments() {
      pathSegments = [];
      totalPathLength = 0;
      for (let i = 0; i < routePoints.length - 1; i++) {
        const from = routePoints[i];
        const to = routePoints[i + 1];
        const len = calcDistance(from.lat, from.lng, to.lat, to.lng);
        pathSegments.push({
          startDist: totalPathLength,
          length: len,
          from, to
        });
        totalPathLength += len;
      }
    }

    function getPositionAtDistance(dist) {
      if (pathSegments.length === 0 || dist <= 0) return routePoints[0];
      if (dist >= totalPathLength) return routePoints[routePoints.length - 1];
      for (const seg of pathSegments) {
        if (dist <= seg.startDist + seg.length) {
          const t = (dist - seg.startDist) / seg.length;
          return {
            lat: seg.from.lat + (seg.to.lat - seg.from.lat) * t,
            lng: seg.from.lng + (seg.to.lng - seg.from.lng) * t
          };
        }
      }
      return routePoints[routePoints.length - 1];
    }

    function setTarget(lat, lng) {
      targetPos = { lat, lng };
      document.getElementById('latInput').value = lat.toFixed(6);
      document.getElementById('lngInput').value = lng.toFixed(6);
      if (targetMarker) {
        targetMarker.setLatLng([lat, lng]);
      } else {
        targetMarker = L.marker([lat, lng], { icon: targetIcon }).addTo(map).bindPopup('相手');
      }
      document.getElementById('status').textContent = '相手の位置をセットしました';
      updateDistance();
    }

    function setDest(lat, lng) {
      destPos = { lat, lng };
      if (destMarker) {
        destMarker.setLatLng([lat, lng]);
      } else {
        destMarker = L.marker([lat, lng], { icon: destIcon }).addTo(map).bindPopup('目的地');
      }
      document.getElementById('status').textContent = '目的地をセットしました';
      setDestMode = false;
      document.getElementById('setDestModeBtn').classList.remove('active');
      updateTip();
    }

    function addRoutePoint(lat, lng) {
      // 最初の点は現在の赤ピン位置から始める（あれば）
      if (routePoints.length === 0 && targetPos) {
        routePoints.push({ ...targetPos });
      }
      routePoints.push({ lat, lng });
      drawRouteLine();
      document.getElementById('status').textContent = `ルート点を追加（${routePoints.length}点）`;
    }

    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      if (drawRouteMode) {
        if (isMoving) stopMove();
        addRoutePoint(lat, lng);
      } else if (setDestMode) {
        setDest(lat, lng);
      } else {
        if (isMoving) stopMove();
        setTarget(lat, lng);
      }
    });

    function getLocation() {
      if (!navigator.geolocation) {
        document.getElementById('status').textContent = '位置情報に対応していません';
        return;
      }
      document.getElementById('status').textContent = '現在地を取得中...';
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          if (myMarker) myMarker.setLatLng([myPos.lat, myPos.lng]);
          else myMarker = L.marker([myPos.lat, myPos.lng], { icon: myIcon }).addTo(map).bindPopup('自分');
          map.setView([myPos.lat, myPos.lng], 16);
          document.getElementById('status').textContent = `現在地を取得（精度約${Math.round(pos.coords.accuracy)}m）`;
          updateDistance();
          if (watchId === null) {
            watchId = navigator.geolocation.watchPosition(
              (p) => {
                myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
                if (myMarker) myMarker.setLatLng([myPos.lat, myPos.lng]);
                updateDistance();
              },
              () => {},
              { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
            );
          }
        },
        (err) => {
          let msg = '位置情報を取得できませんでした';
          if (err.code === 1) msg = '位置情報の許可が必要です';
          if (err.code === 2) msg = '位置を取得できません';
          if (err.code === 3) msg = 'タイムアウト。再試行してください';
          document.getElementById('status').textContent = msg;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    document.getElementById('getLocationBtn').onclick = getLocation;

    document.getElementById('clearBtn').onclick = () => {
      stopMove();
      if (targetMarker) { map.removeLayer(targetMarker); targetMarker = null; }
      if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
      targetPos = null; destPos = null;
      clearRoute();
      document.getElementById('latInput').value = '';
      document.getElementById('lngInput').value = '';
      document.getElementById('distance').textContent = '距離：―';
      document.getElementById('status').textContent = 'クリアしました';
      setDestMode = false; drawRouteMode = false;
      document.getElementById('setDestModeBtn').classList.remove('active');
      document.getElementById('drawRouteBtn').classList.remove('active');
      updateTip();
    };

    document.getElementById('centerMyBtn').onclick = () => {
      if (myPos) map.setView([myPos.lat, myPos.lng], 16);
    };

    document.getElementById('setDestModeBtn').onclick = () => {
      setDestMode = !setDestMode;
      if (setDestMode) {
        drawRouteMode = false;
        document.getElementById('drawRouteBtn').classList.remove('active');
      }
      document.getElementById('setDestModeBtn').classList.toggle('active', setDestMode);
      updateTip();
      if (setDestMode) document.getElementById('status').textContent = '地図をタップして目的地を設定';
    };

    document.getElementById('drawRouteBtn').onclick = () => {
      drawRouteMode = !drawRouteMode;
      if (drawRouteMode) {
        setDestMode = false;
        document.getElementById('setDestModeBtn').classList.remove('active');
        // 開始点として赤ピンを入れる
        if (routePoints.length === 0 && targetPos) {
          routePoints.push({ ...targetPos });
          drawRouteLine();
        }
      }
      document.getElementById('drawRouteBtn').classList.toggle('active', drawRouteMode);
      updateTip();
      if (drawRouteMode) document.getElementById('status').textContent = '地図をタップしてルートをなぞってください';
    };

    function clearRoute() {
      routePoints = [];
      if (routePolyline) {
        map.removeLayer(routePolyline);
        routePolyline = null;
      }
      pathSegments = [];
      totalPathLength = 0;
      currentPathDist = 0;
    }

    document.getElementById('clearRouteBtn').onclick = () => {
      if (isMoving) stopMove();
      clearRoute();
      document.getElementById('status').textContent = 'ルートを消しました';
    };

    document.getElementById('settingsBtn').onclick = () => {
      document.getElementById('settingsPanel').classList.toggle('show');
    };

    function getSpeedMps() {
      const val = parseFloat(document.getElementById('speedInput').value) || 1.4;
      const unit = document.getElementById('speedUnit').value;
      return unit === 'kmh' ? val / 3.6 : val;
    }

    function startMove() {
      if (!targetPos) {
        document.getElementById('status').textContent = '先に相手（赤ピン）の位置をセットしてください';
        return;
      }
      if (isMoving) {
        stopMove();
        return;
      }

      // ルートがあればルートを使う。なければ目的地へ直線
      if (routePoints.length < 2) {
        if (!destPos) {
          document.getElementById('status').textContent = 'ルートをなぞるか、目的地をセットしてください';
          return;
        }
        // 直線ルートを作る
        routePoints = [{ ...targetPos }, { ...destPos }];
        drawRouteLine();
      }

      buildPathSegments();
      if (totalPathLength < 1) {
        document.getElementById('status').textContent = 'ルートが短すぎます';
        return;
      }

      // 開始位置をルートの先頭に合わせる
      currentPathDist = 0;
      const startPos = getPositionAtDistance(0);
      targetPos = { ...startPos };
      if (targetMarker) targetMarker.setLatLng([targetPos.lat, targetPos.lng]);

      isMoving = true;
      document.getElementById('startMoveBtn').textContent = '停止';
      document.getElementById('startMoveBtn').classList.add('orange');
      lastMoveTime = performance.now();
      document.getElementById('status').textContent = 'ルートに沿って移動中...';

      moveInterval = setInterval(() => {
        const now = performance.now();
        const dt = (now - lastMoveTime) / 1000;
        lastMoveTime = now;

        const speed = getSpeedMps();
        currentPathDist += speed * dt;

        if (currentPathDist >= totalPathLength) {
          const endPos = routePoints[routePoints.length - 1];
          targetPos = { ...endPos };
          if (targetMarker) targetMarker.setLatLng([targetPos.lat, targetPos.lng]);
          stopMove();
          document.getElementById('status').textContent = 'ルートの終点に到着しました';
          updateDistance();
          return;
        }

        const newPos = getPositionAtDistance(currentPathDist);
        targetPos = { ...newPos };
        if (targetMarker) targetMarker.setLatLng([targetPos.lat, targetPos.lng]);
        document.getElementById('latInput').value = targetPos.lat.toFixed(6);
        document.getElementById('lngInput').value = targetPos.lng.toFixed(6);
        updateDistance();

        const remain = totalPathLength - currentPathDist;
        const eta = remain / speed;
        document.getElementById('status').textContent =
          `移動中... 残り約${Math.round(remain)}m（約${Math.ceil(eta)}秒）`;
      }, 80);
    }

    function stopMove() {
      isMoving = false;
      if (moveInterval) {
        clearInterval(moveInterval);
        moveInterval = null;
      }
      document.getElementById('startMoveBtn').textContent = '移動開始';
      document.getElementById('startMoveBtn').classList.remove('orange');
    }

    document.getElementById('startMoveBtn').onclick = startMove;

    setTimeout(getLocation, 500);
    updateTip();
  </script>
</body>
</html>
