<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ピンで位置指定マップ</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; }
    
    #map { 
      height: 58vh; 
      width: 100%; 
      z-index: 1;
    }
    
    .panel {
      padding: 14px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      position: relative;
      z-index: 10;
    }
    
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    
    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      min-width: 140px;
      background: #f8fafc;
    }
    
    button {
      padding: 12px 16px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      white-space: nowrap;
    }
    
    button:active { opacity: 0.85; }
    button.secondary { background: #64748b; }
    button.green { background: #059669; }
    
    #distance {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
      margin: 6px 0 2px;
      text-align: center;
    }
    
    #status { 
      font-size: 13px; 
      color: #666; 
      margin-top: 2px;
      text-align: center;
    }
    
    .note {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      line-height: 1.45;
      text-align: center;
    }

    .tip {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      color: #1e40af;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="tip">
      地図をタップすると相手の位置（赤いピン）を置けます
    </div>

    <div class="row">
      <input type="text" id="latInput" placeholder="緯度" inputmode="decimal" readonly>
      <input type="text" id="lngInput" placeholder="経度" inputmode="decimal" readonly>
    </div>
    <div class="row">
      <button id="getLocationBtn" class="green">現在地を取得</button>
      <button id="clearBtn" class="secondary">ピンを消す</button>
      <button id="centerMyBtn" class="secondary">自分に戻る</button>
    </div>
    <div id="distance">距離：―</div>
    <div id="status">「現在地を取得」を押すか、地図をタップしてください</div>
    <div class="note">
      青ピン＝自分　／　赤ピン＝相手<br>
      地図をタップ → 相手の位置をセット
    </div>
  </div>
  
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 地図初期化
    const map = L.map('map').setView([35.2078, 136.9502], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // アイコン
    const myIcon = L.divIcon({
      className: '',
      html: `<div style="
        width: 22px; height: 22px;
        background: #2563eb;
        border: 3px solid white;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      "></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    const targetIcon = L.divIcon({
      className: '',
      html: `<div style="
        width: 22px; height: 22px;
        background: #dc2626;
        border: 3px solid white;
        border-radius: 50%;
        box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      "></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    let myMarker = null;
    let targetMarker = null;
    let myPos = null;
    let targetPos = null;
    let watchId = null;

    // 距離計算
    function calcDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateDistance() {
      if (myPos && targetPos) {
        const dist = calcDistance(myPos.lat, myPos.lng, targetPos.lat, targetPos.lng);
        document.getElementById('distance').textContent =
          dist < 1000
            ? `距離：約 ${Math.round(dist)} m`
            : `距離：約 ${(dist / 1000).toFixed(2)} km`;

        // 両方見えるように調整
        if (myMarker && targetMarker) {
          const group = L.featureGroup([myMarker, targetMarker]);
          map.fitBounds(group.getBounds().pad(0.25));
        }
      } else {
        document.getElementById('distance').textContent = '距離：―';
      }
    }

    // 相手の位置をセットする共通処理
    function setTarget(lat, lng) {
      targetPos = { lat, lng };

      document.getElementById('latInput').value = lat.toFixed(6);
      document.getElementById('lngInput').value = lng.toFixed(6);

      if (targetMarker) {
        targetMarker.setLatLng([lat, lng]);
      } else {
        targetMarker = L.marker([lat, lng], { icon: targetIcon })
          .addTo(map)
          .bindPopup('相手');
      }

      document.getElementById('status').textContent = '相手の位置をセットしました（地図をタップで変更可能）';
      updateDistance();
    }

    // ★ 地図をクリック/タップしたらピンを立てる
    map.on('click', function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;
      setTarget(lat, lng);
    });

    // 現在地取得
    function getLocation() {
      if (!navigator.geolocation) {
        document.getElementById('status').textContent = '位置情報に対応していません';
        return;
      }

      document.getElementById('status').textContent = '現在地を取得中...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          myPos = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };

          if (myMarker) {
            myMarker.setLatLng([myPos.lat, myPos.lng]);
          } else {
            myMarker = L.marker([myPos.lat, myPos.lng], { icon: myIcon })
              .addTo(map)
              .bindPopup('自分');
          }

          map.setView([myPos.lat, myPos.lng], 16);
          document.getElementById('status').textContent =
            `現在地を取得しました（精度 約${Math.round(pos.coords.accuracy)}m）`;
          updateDistance();

          // 継続監視
          if (watchId === null) {
            watchId = navigator.geolocation.watchPosition(
              (p) => {
                myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
                if (myMarker) myMarker.setLatLng([myPos.lat, myPos.lng]);
                document.getElementById('status').textContent =
                  `位置更新中（精度 約${Math.round(p.coords.accuracy)}m）`;
                updateDistance();
              },
              () => {},
              { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
            );
          }
        },
        (err) => {
          let msg = '位置情報を取得できませんでした';
          if (err.code === 1) msg = '位置情報の許可が必要です';
          if (err.code === 2) msg = '位置を取得できません';
          if (err.code === 3) msg = 'タイムアウトしました。再試行してください';
          document.getElementById('status').textContent = msg;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    document.getElementById('getLocationBtn').onclick = getLocation;

    // ピンを消す
    document.getElementById('clearBtn').onclick = () => {
      if (targetMarker) {
        map.removeLayer(targetMarker);
        targetMarker = null;
      }
      targetPos = null;
      document.getElementById('latInput').value = '';
      document.getElementById('lngInput').value = '';
      document.getElementById('distance').textContent = '距離：―';
      document.getElementById('status').textContent = 'ピンを消しました。地図をタップで再セットできます';
    };

    // 自分に戻る
    document.getElementById('centerMyBtn').onclick = () => {
      if (myPos) {
        map.setView([myPos.lat, myPos.lng], 16);
      }
    };

    // 起動時に現在地取得を試みる
    setTimeout(getLocation, 500);
  </script>
</body>
</html>
