<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>簡易位置マップ + Appleマップ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .panel {
      padding: 14px 16px;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }
    .row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      min-width: 140px;
      background: #f8fafc;
    }
    button {
      padding: 12px 14px;
      font-size: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      white-space: nowrap;
    }
    button:active { opacity: 0.85; }
    .btn-blue { background: #2563eb; }
    .btn-gray { background: #64748b; }
    .btn-green { background: #059669; }
    .btn-apple { background: #000; }
    #distance {
      font-size: 24px;
      font-weight: bold;
      color: #2563eb;
      margin: 8px 0 4px;
      text-align: center;
    }
    #status {
      font-size: 13px;
      color: #666;
      text-align: center;
      min-height: 18px;
    }
    .note {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      text-align: center;
      line-height: 1.4;
    }
    #mapArea {
      flex: 1;
      position: relative;
      background: #e2e8f0;
      min-height: 220px;
    }
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .map-label {
      position: absolute;
      bottom: 10px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: #64748b;
      pointer-events: none;
    }
    .apple-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .apple-row button {
      flex: 1;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="row">
      <input type="text" id="latInput" placeholder="相手の緯度（例: 35.1709）" inputmode="decimal">
      <input type="text" id="lngInput" placeholder="相手の経度（例: 136.8815）" inputmode="decimal">
    </div>
    <div class="row">
      <button id="setBtn" class="btn-blue">相手の位置をセット</button>
      <button id="clearBtn" class="btn-gray">クリア</button>
      <button id="getLocationBtn" class="btn-green">現在地を取得</button>
    </div>

    <div id="distance">距離：―</div>
    <div id="status">「現在地を取得」を押してください</div>

    <!-- Appleマップボタン -->
    <div class="apple-row">
      <button id="openMyApple" class="btn-apple">自分をAppleマップで開く</button>
      <button id="openTargetApple" class="btn-apple">相手をAppleマップで開く</button>
    </div>
    <div class="apple-row">
      <button id="openBothApple" class="btn-apple" style="flex:1">二人の位置をAppleマップで見る</button>
    </div>

    <div class="note">
      青＝自分 / 赤＝相手<br>
      Appleマップボタンで本格的な地図が開けます
    </div>
  </div>

  <div id="mapArea">
    <canvas id="canvas"></canvas>
    <div class="map-label">青：自分　／　赤：相手</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const distanceEl = document.getElementById('distance');

    let myPos = null;
    let targetPos = null;
    let width = 0, height = 0;
    let watchId = null;

    function resize() {
      const area = document.getElementById('mapArea');
      width = area.clientWidth || 300;
      height = area.clientHeight || 300;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      draw();
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 250));
    setTimeout(resize, 50);
    setTimeout(resize, 400);

    function calcDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = x => x * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function updateDistance() {
      if (myPos && targetPos) {
        const dist = calcDistance(myPos.lat, myPos.lng, targetPos.lat, targetPos.lng);
        distanceEl.textContent = dist < 1000
          ? `距離：約 ${Math.round(dist)} m`
          : `距離：約 ${(dist/1000).toFixed(2)} km`;
      } else {
        distanceEl.textContent = '距離：―';
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(0, 0, width, height);

      // グリッド
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1;
      for (let x = 0; x <= width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y <= height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      if (!myPos) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('現在地がまだ取得できていません', width/2, height/2 - 8);
        ctx.fillText('「現在地を取得」を押してください', width/2, height/2 + 14);
        return;
      }

      let cLat = myPos.lat, cLng = myPos.lng, scale = 50000;
      if (targetPos) {
        cLat = (myPos.lat + targetPos.lat) / 2;
        cLng = (myPos.lng + targetPos.lng) / 2;
        const d = calcDistance(myPos.lat, myPos.lng, targetPos.lat, targetPos.lng);
        scale = (Math.min(width, height) * 0.32) / (d / 111320 || 0.001);
        scale = Math.max(7000, Math.min(scale, 160000));
      }

      function toXY(lat, lng) {
        return {
          x: width/2 + (lng - cLng) * scale * Math.cos(cLat * Math.PI/180),
          y: height/2 - (lat - cLat) * scale
        };
      }

      const me = toXY(myPos.lat, myPos.lng);

      if (targetPos) {
        const you = toXY(targetPos.lat, targetPos.lng);
        ctx.beginPath();
        ctx.moveTo(me.x, me.y);
        ctx.lineTo(you.x, you.y);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3;
        ctx.setLineDash([7, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 赤（相手）
        ctx.beginPath();
        ctx.arc(you.x, you.y, 15, 0, Math.PI*2);
        ctx.fillStyle = '#dc2626';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
      }

      // 青（自分）
      ctx.beginPath();
      ctx.arc(me.x, me.y, 15, 0, Math.PI*2);
      ctx.fillStyle = '#2563eb';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
    }

    // 位置取得
    function getLocation() {
      if (!navigator.geolocation) {
        statusEl.textContent = 'このブラウザは位置情報に対応していません';
        return;
      }
      statusEl.textContent = '位置情報を取得中...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          statusEl.textContent = `現在地を取得しました（精度 約${Math.round(pos.coords.accuracy)}m）`;
          updateDistance();

          if (watchId === null) {
            watchId = navigator.geolocation.watchPosition(
              (p) => {
                myPos = { lat: p.coords.latitude, lng: p.coords.longitude };
                statusEl.textContent = `位置更新中（精度 約${Math.round(p.coords.accuracy)}m）`;
                updateDistance();
              },
              () => {},
              { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
            );
          }
        },
        (err) => {
          let msg = '位置情報を取得できませんでした';
          if (err.code === 1) msg = '位置情報の許可が必要です';
          if (err.code === 2) msg = '位置を取得できません（電波状況を確認）';
          if (err.code === 3) msg = 'タイムアウトしました。再試行してください';
          statusEl.textContent = msg;
          draw();
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    document.getElementById('getLocationBtn').onclick = getLocation;

    // 相手セット
    document.getElementById('setBtn').onclick = () => {
      const lat = parseFloat(document.getElementById('latInput').value);
      const lng = parseFloat(document.getElementById('lngInput').value);
      if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        alert('緯度と経度を正しく入力してください');
        return;
      }
      targetPos = { lat, lng };
      statusEl.textContent = '相手の位置をセットしました';
      updateDistance();
    };

    // クリア
    document.getElementById('clearBtn').onclick = () => {
      targetPos = null;
      document.getElementById('latInput').value = '';
      document.getElementById('lngInput').value = '';
      distanceEl.textContent = '距離：―';
      statusEl.textContent = 'クリアしました';
      draw();
    };

    // ===== Appleマップを開く =====
    function openAppleMaps(lat, lng, label) {
      // iOSでは maps:// の方がネイティブアプリを直接開ける
      const url = `https://maps.apple.com/?ll=${lat},${lng}&q=${encodeURIComponent(label)}&z=16`;
      window.open(url, '_blank');
    }

    document.getElementById('openMyApple').onclick = () => {
      if (!myPos) {
        alert('先に現在地を取得してください');
        return;
      }
      openAppleMaps(myPos.lat, myPos.lng, '自分の位置');
    };

    document.getElementById('openTargetApple').onclick = () => {
      if (!targetPos) {
        alert('先に相手の位置をセットしてください');
        return;
      }
      openAppleMaps(targetPos.lat, targetPos.lng, '相手の位置');
    };

    document.getElementById('openBothApple').onclick = () => {
      if (!myPos || !targetPos) {
        alert('自分と相手の両方の位置が必要です');
        return;
      }
      // 経路表示
      const url = `https://maps.apple.com/?saddr=${myPos.lat},${myPos.lng}&daddr=${targetPos.lat},${targetPos.lng}`;
      window.open(url, '_blank');
    };

    // 起動時に位置取得を試みる
    setTimeout(getLocation, 600);
  </script>
</body>
</html>
